services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: ffmpeg-auto-api:dev
    volumes:
      - workdir:/workdir
    environment:
      MAX_CONCURRENT_JOBS: "1"
      MAX_QUEUED_JOBS: "20"
      MAX_UPLOAD_BYTES: "4294967296"
      JOB_RETENTION_HOURS: "24"
      WORKDIR: /workdir
      LOG_LEVEL: info
    restart: unless-stopped
    expose:
      - "9090"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ffmpeg-auto-web:dev
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  workdir:
